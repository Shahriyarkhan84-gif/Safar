<!doctype html><html lang="en-GB" class="x"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Safar X</title><meta name="description" content="The Safar driver app: go online, accept rides and track your earnings.">
<meta name="theme-color" content="#0a0d1c"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Safar X">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one phone-width column. Safar Rides follows the phone's light/dark setting; Safar X is always dark for night driving. */
:root{
  --bg:#eef0f5; --surface:#ffffff; --ink:#10131c; --muted:#5c6273; --line:#dadde6; --chip:#e4e7ef;
  --accent:#2347e0; --accent-ink:#ffffff; --accent-soft:#dde4ff; --amber:#d98f00; --amber-soft:#fdeccb;
  --danger:#c2362b; --danger-soft:#f8dcd9; --ok:#17845a; --ok-soft:#d6efe3;
  --road:#ffffff; --ground:#e2e5ee; --park:#cde5d4; --water:#c9dcf1; --car:#10131c;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c0f17; --surface:#151a26; --ink:#e8ebf3; --muted:#98a0b3; --line:#262c3b; --chip:#1d2331;
  --accent:#7b95ff; --accent-ink:#0a0f22; --accent-soft:#1f2a52; --amber:#f4b13a; --amber-soft:#3a2c10;
  --danger:#ea6a5e; --danger-soft:#3d1c19; --ok:#4cc58e; --ok-soft:#163626;
  --road:#2a3142; --ground:#171c28; --park:#1b3326; --water:#17263a; --car:#e8ebf3; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c0f17; --surface:#151a26; --ink:#e8ebf3; --muted:#98a0b3; --line:#262c3b; --chip:#1d2331;
  --accent:#7b95ff; --accent-ink:#0a0f22; --accent-soft:#1f2a52; --amber:#f4b13a; --amber-soft:#3a2c10;
  --danger:#ea6a5e; --danger-soft:#3d1c19; --ok:#4cc58e; --ok-soft:#163626;
  --road:#2a3142; --ground:#171c28; --park:#1b3326; --water:#17263a; --car:#e8ebf3; color-scheme:dark }
html:root.x.x{
  --bg:#0b0d14; --surface:#151821; --card:#151821; --ink:#f2f2f0; --muted:#9a9db0; --line:#262a36; --chip:#1d212c;
  --accent:#ff6f59; --accent-ink:#111; --accent-soft:#2c1c1c; --amber:#ff6f59; --amber-soft:#2c1c1c;
  --danger:#ff6f59; --danger-soft:#2c1c1c; --ok:#ff6f59; --ok-soft:#2c1c1c; --promo:#ff6f59;
  --road:#1e2230; --ground:#11141c; --park:#13201b; --water:#14203a; --car:#f2f2f0; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:1.7rem;font-weight:800;font-stretch:118%}
h2{font-size:1.15rem;font-weight:700;font-stretch:112%}
h3{font-size:1rem;font-weight:700;font-stretch:105%}
p{margin:0}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.top-in b{font:800 1.25rem var(--display);font-stretch:122%}
.top-in svg{width:30px;height:30px;flex:none}
.conn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font:600 .72rem var(--mono);padding:4px 9px;border-radius:99px;background:var(--chip);color:var(--ink);white-space:nowrap}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.conn.live i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.tight{gap:5px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet.hot{border:2px solid var(--accent)}

.map{width:100%;height:auto;display:block;border-radius:18px;border:1px solid var(--line);background:var(--ground)}
.map .lbl{font:600 8.5px var(--body);fill:var(--muted);paint-order:stroke;stroke:var(--ground);stroke-width:3px;stroke-linejoin:round}
.map .lbl.hot{fill:var(--ink);font-size:9.5px;font-weight:700}

.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:700 .95rem var(--body);padding:13px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.seg{display:inline-flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;font:700 .86rem var(--body);color:var(--muted);padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}

input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:.8rem;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;font-size:.92rem;cursor:pointer}
.checks input{width:20px;height:20px;flex:none;accent-color:var(--accent)}

.route{display:grid;grid-template-columns:22px 1fr auto;gap:8px 10px;align-items:center}
.route .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);justify-self:center}
.route .sq{width:12px;height:12px;background:var(--ink);justify-self:center}
.route .rail{width:2px;height:14px;background:var(--line);justify-self:center}
.route select{font-weight:600}
.swap{grid-row:1/4;grid-column:3;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.1rem}

.rides{display:flex;flex-direction:column;gap:8px}
.ride{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.ride[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ride svg{width:52px;height:30px}
.ride .fare{font:600 1rem var(--mono);text-align:right}
.ride > div{min-width:0}

.plate{font:600 .88rem var(--mono);letter-spacing:.08em;background:#f6cf1a;color:#111;padding:2px 8px;border-radius:4px;border:1.5px solid #111;white-space:nowrap}
.drv{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.drv > div{min-width:0}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 1.15rem var(--display);font-stretch:120%}
.pin{display:flex;gap:8px}
.pin span{width:44px;height:50px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font:600 1.35rem var(--mono)}
.pininput{font:600 1.6rem var(--mono);letter-spacing:.5em;text-align:center;padding:12px}
.status{font:800 1.3rem var(--display);font-stretch:115%}
.pulse{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;margin:6px auto;position:relative}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 1.8s ease-out infinite}
.pulse::after{animation-delay:.9s}
.pulse i{width:18px;height:18px;border-radius:50%;background:var(--accent)}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.1);opacity:0}}
.prog{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.sumrow{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sumrow.total{font-weight:800;font-size:1.1rem;padding-top:8px;border-top:1px dashed var(--line)}
.stars{display:flex;gap:4px;justify-content:center}
.stars button{border:0;background:none;font-size:2.1rem;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.stars button.on{color:var(--amber)}
.tips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 0;font:600 .9rem var(--mono);cursor:pointer}
.tips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.err{color:var(--danger);font-size:.85rem;font-weight:700}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:.85rem}
.note.amber{background:var(--amber-soft)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:.9rem}
.count{width:62px;height:62px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;font:600 1.4rem var(--mono);color:var(--accent);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 .74rem var(--body);padding:4px 10px;border-radius:99px;background:var(--accent-soft);white-space:nowrap}
.pill::before{display:none}

.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;font:700 .95rem var(--body);color:var(--ink);padding:0}
.switch i{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:transform .2s}
.switch[aria-checked="true"] i{background:var(--accent)}
.switch[aria-checked="true"] i::after{transform:translateX(18px)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px}
.kpi b{font:800 1.5rem/1.1 var(--display);font-stretch:112%;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.list > div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.88rem}
.list > div:first-child{border-top:0}
.list > div > span:first-child{min-width:0}
.foot{text-align:center;font-size:.84rem;color:var(--muted)}
.foot a{font-weight:700}

.apps{display:grid;gap:14px}
.appcard{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:18px;border-radius:20px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface)}
.appcard svg{width:64px;height:64px}
.appcard.drive{background:#0a0c10;color:#f1f3f7;border-color:#252a36}
.appcard.drive .muted{color:#99a1b2}
.appcard > div{min-width:0}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:18px 4px}
.hero svg{width:56px;height:56px}
.hero h1{font-size:2rem}
.tel{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tel span{display:grid;place-items:center;padding:0 12px;background:var(--chip);font:600 .95rem var(--mono);border-right:1px solid var(--line)}
.tel input{border:0;border-radius:0}
.linkbtn{border:0;background:none;color:var(--accent);font:700 .92rem var(--body);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.center{text-align:center}

#toasts{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 14px;font-size:.88rem;display:flex;gap:10px;box-shadow:0 10px 30px rgb(0 0 0 / .25);animation:pop .25s ease-out}
.toast .who{font:600 .68rem var(--mono);text-transform:uppercase;color:var(--amber);flex:none;padding-top:2px}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tel.pw{grid-template-columns:1fr auto}
.tel.pw .linkbtn{padding:0 14px;text-decoration:none}
.avatar.sm{width:36px;height:36px;font-size:.8rem;margin-left:auto;border:0;cursor:pointer}

/* sign-in: picture on top, one field, one big button */
.authwrap{max-width:560px;margin:0 auto;padding-bottom:40px;display:flex;flex-direction:column;gap:20px}
.heroart{width:100%;height:auto;display:block;max-height:46vh;object-fit:cover}
.authbody{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.authwrap > .authbody:first-child{padding-top:24px}
.authh{font-size:1.8rem;font-weight:800;font-stretch:112%}
.authh.big{font-size:2.1rem}
.identbox{background:var(--chip);border:1px solid transparent;padding:18px;font-size:1.1rem;border-radius:12px}
.identbox:focus{border-color:var(--ink);outline:none}
.authgo{padding:17px;font-size:1.1rem;border-radius:12px}
.idchip{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--chip);border-radius:12px;padding:14px 16px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.authwrap .foot{padding:0 20px}

/* ===== Shared components (calm, product-style) ===== */
h1,h2,h3,.status,.kpi b,.avatar{font-stretch:normal!important;letter-spacing:-.01em}
h1{font-size:1.6rem}
.label{font-size:.84rem;letter-spacing:0;text-transform:none;font-weight:600;color:var(--muted)}
.display{font:700 1.75rem/1.1 var(--display);letter-spacing:-.02em;margin:0}
/* map */
.mapslot{position:relative;height:38vh;min-height:240px;border-radius:16px;overflow:hidden;background:var(--ground);border:1px solid var(--line)}
.mapslot.tall{height:52vh}
.mapslot.hero{height:42vh;border-radius:0;border:0;border-bottom:1px solid var(--line)}
.mapslot.nomap{display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.lmap{position:absolute!important;inset:0;width:100%;height:100%}
.leaflet-container{background:#1b1d22;font:inherit}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.82) contrast(.9) saturate(.35)}
.leaflet-control-attribution{background:rgb(0 0 0 / .55)!important;color:#bbb!important;font-size:10px!important}
.leaflet-control-attribution a{color:#ddd!important}
.mlabel{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:none;font:600 11px var(--body);padding:2px 6px}
.mlabel::before{display:none}
.mend{background:var(--ink);border:4px solid #111;box-sizing:border-box}
.mcarwrap{background:none;border:0}
.mcar{width:100%;height:100%;display:grid;place-items:center}
.mcar svg{width:100%;height:auto}
.mcar rect{fill:#f2f2f2;stroke:#111;stroke-width:1.2}
.mcar rect.gl{fill:#333;stroke:none}
.mcar.mine rect{fill:var(--accent)}
.mcar.mine rect.gl{fill:#111;opacity:.55}
/* pickup / drop-off list used on trip screens and receipts */
.ribbon{position:relative;display:flex;flex-direction:column}
.ribbon::before{content:"";position:absolute;left:9px;top:24px;bottom:24px;width:2px;background:var(--line)}
.rstop{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:8px 0;position:relative;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left}
.rstop > i{width:12px;height:12px;justify-self:center;border-radius:50%;background:var(--ink);z-index:1}
.rstop.end > i{border-radius:2px}
.rstop > span{min-width:0}
.rstop small{display:block;color:var(--muted);font-size:.8rem}
.rstop b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rstop .side{font-size:.88rem;color:var(--muted);text-align:right;white-space:nowrap}
/* ticket: only for the PIN and the receipt */
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.perf{position:relative;margin:2px -16px;border-top:2px dashed var(--line);height:0}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-11px;clip-path:inset(0 0 0 50%)}
.perf::after{right:-11px;clip-path:inset(0 50% 0 0)}
.stub{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring svg circle{fill:none;stroke-linecap:round}
.ring .in{position:relative;text-align:center;line-height:1.1}
.brandmini{display:inline-flex;align-items:center;gap:8px;font:700 1.02rem var(--display)}
.brandmini svg{width:26px;height:26px}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.secthead h2{font-size:1.1rem}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(var(--n,4),1fr);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:25}
.tabbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font:600 .72rem var(--body);cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="true"]{color:var(--ink)}
.list2{display:flex;flex-direction:column}
.list2 > *{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;padding:12px 0;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.list2 > *:last-child{border-bottom:0}

.menu > * > span:first-child{min-width:0}
.swipe{position:relative;height:60px;border-radius:999px;background:var(--chip);overflow:hidden}
.swipe span{position:absolute;inset:0;display:grid;place-items:center;font:700 1rem var(--body);color:var(--ink);pointer-events:none;padding-left:40px}
.swipe input{-webkit-appearance:none;appearance:none;position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0 4px;background:transparent;border:0;border-radius:999px;cursor:grab}

.swipe input::-moz-range-thumb{width:52px;height:52px;border:0;border-radius:50%;background:var(--accent)}
.swipe input:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px}
.bars > div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:30px;border-radius:4px;background:var(--line);min-height:3px}

#toasts{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
@keyframes pop{from{transform:translateY(-8px);opacity:.4}to{transform:none;opacity:1}}
.panel{display:flex;flex-direction:column;gap:12px}
.ico{width:18px;height:18px;vertical-align:-3px;flex:none}
.textbtn{border:0;background:none;color:var(--muted);font:600 .92rem var(--body);cursor:pointer;padding:10px 0;align-self:center}
.textbtn.danger{color:var(--danger)}

<body><div id="app"></div><div id="toasts" aria-live="polite"></div>
<script>/* ===== Safar shared core: used by both Safar Rides and Safar X ===== */
const SB_URL = 'https://uprrsqqnnvpjevoujxmk.supabase.co';
const SB_KEY = 'sb_publishable_eMwkhTp9QRaT2s6YM03kHg_ZSG4u3uN';
const FEE = 0.25, SIM_AFTER = 22000, REQ_WINDOW = 20000, POLL_MS = 2500;
const FARE = { base: 2.5, mile: 1.25, min: 0.2, minimum: 5 };
const CITY = { lat: 53.7997, lng: -1.5492 };
const PLACES = {
  home: { name: '14 Elm Street', area: 'Hyde Park, Leeds LS6', lat: 53.8128, lng: -1.5640 }, station: { name: 'Leeds Station', area: 'New Station St, Leeds LS1 4DY', lat: 53.7950, lng: -1.5476 },
  trinity: { name: 'Trinity Leeds', area: 'Albion St, Leeds LS1 5AT', lat: 53.7963, lng: -1.5440 }, uni: { name: 'University of Leeds', area: 'Woodhouse Ln, Leeds LS2 9JT', lat: 53.8067, lng: -1.5550 },
  headingley: { name: 'Headingley Stadium', area: "St Michael's Ln, Leeds LS6 3BR", lat: 53.8170, lng: -1.5820 }, kirkstall: { name: 'Kirkstall Abbey', area: 'Abbey Rd, Leeds LS5 3EH', lat: 53.8203, lng: -1.6066 },
  roundhay: { name: 'Roundhay Park', area: 'Mansion Ln, Leeds LS8 2HH', lat: 53.8390, lng: -1.4970 }, whiterose: { name: 'White Rose Centre', area: 'Dewsbury Rd, Leeds LS11 8LU', lat: 53.7590, lng: -1.5770 },
  airport: { name: 'Leeds Bradford Airport', area: 'Whitehouse Ln, Yeadon LS19 7TU', lat: 53.8659, lng: -1.6606, airport: true }
};
/* fare rules: busy times cost more, airport trips add a fixed fee; fees after the ride are worked out by the server */
const RULES = { busyMult: 1.25, airportFee: 3, cancelFee: 3, cancelAfterMin: 2, waitFreeMin: 3, waitPerMin: 0.25, waitMax: 5 };
function busyAt(ts) { const d = new Date(ts), h = d.getHours() + d.getMinutes() / 60, wd = d.getDay(); if (wd >= 1 && wd <= 5 && ((h >= 7.5 && h < 9.5) || (h >= 16.5 && h < 18.5))) return true; if (((wd === 5 || wd === 6) && h >= 22) || ((wd === 6 || wd === 0) && h < 3)) return true; return false; }
const TYPES = {
  go: { name: 'Safar Go', seats: 4, mult: 1, blurb: 'Everyday rides' },
  green: { name: 'Safar Green', seats: 4, mult: 1.1, blurb: 'Fully electric cars', promo: 0.1 },
  comfort: { name: 'Comfort', seats: 4, mult: 1.35, blurb: 'Newer cars, more legroom' },
  xl: { name: 'Safar XL', seats: 6, mult: 1.65, blurb: 'Groups and luggage' }
};
const SIM = [
  { name: 'Ayesha Malik', car: 'Toyota Prius', colour: 'White', plate: 'YK70 TFR', rating: 4.95, types: ['go'], pos: { lat: 53.8010, lng: -1.5390 } },
  { name: 'Tom Brennan', car: 'Škoda Octavia', colour: 'Grey', plate: 'LS19 KJD', rating: 4.88, types: ['go', 'comfort'], pos: { lat: 53.8100, lng: -1.5720 } },
  { name: 'Imran Shah', car: 'Kia Niro EV', colour: 'Blue', plate: 'YB22 NWA', rating: 4.91, types: ['go', 'green'], pos: { lat: 53.8240, lng: -1.5250 } },
  { name: 'Grace Okafor', car: 'Ford Galaxy', colour: 'Black', plate: 'LN68 XLG', rating: 4.97, types: ['go', 'xl'], pos: { lat: 53.7760, lng: -1.5650 } }
];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '£' + (Math.round(n * 100) / 100).toFixed(2);
const first = n => String(n || '').split(' ')[0];
const initials = n => String(n || '?').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { if (v === null || v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const normPhone = v => { let d = String(v || '').replace(/\D/g, ''); if (d.startsWith('44')) d = d.slice(2); if (d.startsWith('0')) d = d.slice(1); return /^7\d{9}$/.test(d) ? d : null; };
const showPhone = d => '+44 ' + d.slice(0, 4) + ' ' + d.slice(4);

/* ---------- server ---------- */
class ApiError extends Error { constructor(msg, kind) { super(msg); this.kind = kind; } }
async function rpc(fn, args) {
  let r;
  try {
    r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) });
  } catch (e) { throw new ApiError('No connection. Check your internet and try again.', 'network'); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) {
    if (j && j.hint === 'session') throw new ApiError(j.message, 'session');
    if (j && (j.code === 'PGRST202' || j.code === '42883' || j.code === '42P01')) throw new ApiError('Safar is still being set up. Try again in a minute.', 'setup');
    if (j && j.code === 'P0001' && j.message) throw new ApiError(j.message, 'rule');
    throw new ApiError('Something went wrong on our side. Try again in a moment.', 'error');
  }
  return j;
}

/* ---------- geometry & pricing: real Leeds coordinates, road routes from OpenStreetMap ---------- */
const rad = d => d * Math.PI / 180;
function hav(a, b) { const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lng - a.lng) / 2) ** 2; return 2 * 3958.8 * Math.asin(Math.sqrt(h)); }
const pt = p => p && p.lat != null ? { lat: +p.lat, lng: +p.lng } : { ...CITY };
const rkey = (a, b) => [a.lat, a.lng, b.lat, b.lng].map(n => (+n).toFixed(4)).join(',');
const ROUTES = LS.get('safar-routes', {}), routeWait = new Set();
function path(a, b) { a = pt(a); b = pt(b); const k = rkey(a, b); if (ROUTES[k]) return ROUTES[k]; fetchRoute(a, b, k); return [a, b]; }
async function fetchRoute(a, b, k) {
  if (routeWait.has(k) || hav(a, b) < 0.02) return; routeWait.add(k);
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=simplified&geometries=geojson`);
    const c = (await r.json()).routes[0].geometry.coordinates;
    if (c.length > 1) {
      ROUTES[k] = c.map(([lng, lat]) => ({ lat: +lat.toFixed(5), lng: +lng.toFixed(5) }));
      const keys = Object.keys(ROUTES); if (keys.length > 80) delete ROUTES[keys[0]];
      LS.set('safar-routes', ROUTES); MAP.key = ''; render();
    }
  } catch (e) {}
}
function len(p) { let d = 0; for (let i = 1; i < p.length; i++) d += hav(p[i - 1], p[i]); return d; }
const roadMiles = (a, b) => { const p = path(a, b); return p.length > 2 ? len(p) : hav(pt(a), pt(b)) * 1.3; };
function pointAt(p, t) {
  let goal = Math.min(1, Math.max(0, t)) * len(p);
  for (let i = 1; i < p.length; i++) {
    const A = p[i - 1], B = p[i], d = hav(A, B);
    if (goal <= d || i === p.length - 1) { const f = d ? Math.min(1, goal / d) : 1; return { lat: A.lat + (B.lat - A.lat) * f, lng: A.lng + (B.lng - A.lng) * f, a: d ? Math.atan2(-(B.lat - A.lat), (B.lng - A.lng) * Math.cos(rad(A.lat))) * 180 / Math.PI : 0 }; }
    goal -= d;
  }
  const e = p[p.length - 1]; return { lat: e.lat, lng: e.lng, a: 0 };
}
function fareFor(from, to, type, at = Date.now()) {
  const miles = roadMiles(PLACES[from], PLACES[to]), mins = Math.round(miles * 3.2 + 3), m = TYPES[type].mult;
  const parts = { base: FARE.base * m, dist: FARE.mile * miles * m, time: FARE.min * mins * m };
  let full = Math.max(parts.base + parts.dist + parts.time, FARE.minimum * m);
  const busy = busyAt(at); if (busy) { parts.busy = full * (RULES.busyMult - 1); full += parts.busy; }
  if (PLACES[from].airport || PLACES[to].airport) { parts.airport = RULES.airportFee; full += RULES.airportFee; }
  const off = TYPES[type].promo ? full * TYPES[type].promo : 0;
  if (off) parts.promo = -off;
  return { miles, mins, parts, busy, full: Math.round(full * 100) / 100, fare: Math.round((full - off) * 100) / 100 };
}
const tripTotal = t => (t.fare || 0) + (t.waitFee || 0);
const minsBetween = (a, b) => Math.max(1, Math.round(roadMiles(a, b) * 3 + 1));
const nearestSim = (p, type) => SIM.filter(d => d.types.includes(type)).sort((a, b) => hav(a.pos, p) - hav(b.pos, p))[0];

/* ---------- trip phases, derived from timestamps so both phones agree ---------- */
function phase(t, now = Date.now()) {
  if (t.status === 'accepted') return now < t.acceptedAt + t.pickupDur ? 'arriving' : 'arrived';
  if (t.status === 'ontrip') return now < t.startedAt + t.tripDur ? 'ontrip' : 'dropoff';
  return t.status;
}
function progress(t, now = Date.now()) {
  const ph = phase(t, now);
  if (ph === 'arriving') return Math.min(1, (now - t.acceptedAt) / t.pickupDur);
  if (ph === 'ontrip') return Math.min(1, (now - t.startedAt) / t.tripDur);
  return ph === 'searching' ? 0 : 1;
}
function carPos(t, now = Date.now()) {
  const ph = phase(t, now), A = PLACES[t.from], B = PLACES[t.to];
  if (ph === 'arriving') return pointAt(path(t.start && t.start.lat != null ? t.start : A, A), progress(t, now));
  if (ph === 'arrived') return { ...pt(A), a: 0 };
  if (ph === 'ontrip') return pointAt(path(A, B), progress(t, now));
  return { ...pt(B), a: 0 };
}
function etaText(t) {
  const ph = phase(t), p = progress(t);
  if (ph === 'arriving') return `Arriving in ${Math.max(1, Math.ceil((1 - p) * t.pickupMins))} min`;
  if (ph === 'arrived') return 'Waiting at pickup';
  if (ph === 'ontrip') return `${Math.max(1, Math.ceil((1 - p) * t.mins))} min to ${PLACES[t.to].name}`;
  if (ph === 'dropoff') return `Arrived at ${PLACES[t.to].name}`;
  return '';
}

/* ---------- UI pieces ---------- */
function toast(who, text) {
  const box = document.getElementById('toasts'), el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `<span class="who">${esc(who)}</span><span>${esc(text)}</span>`;
  box.appendChild(el); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 4500);
}
const LOGO_R = `<svg viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="9" fill="#e8c07a"/><path d="M8.5 20 C 11 9, 19 21, 21.5 10" fill="none" stroke="#1a1406" stroke-width="2.6" stroke-linecap="round"/><circle cx="8.5" cy="20" r="2.4" fill="#e8c07a" stroke="#1a1406" stroke-width="1.8"/><rect x="19.3" y="7.8" width="4.4" height="4.4" fill="#1a1406"/></svg>`;
const LOGO_X = `<svg viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="9" fill="#ff6f59"/><path d="M9.5 9.5 L20.5 20.5 M20.5 9.5 L9.5 20.5" stroke="#0a0d1c" stroke-width="3.4" stroke-linecap="round"/></svg>`;
/* ---------- live map (Leaflet + OpenStreetMap tiles, darkened with a CSS filter). One map is kept alive and moved into each screen's slot. ---------- */
const MAP = { el: null, map: null, layer: null, cars: {}, key: '' };
const mapSlot = (o, cls = '') => `<div class="mapslot ${cls}" data-map="${esc(JSON.stringify(o))}" role="img" aria-label="Map of Leeds"></div>`;
const carHTML = (a, mine) => `<div class="mcar${mine ? ' mine' : ''}" style="transform:rotate(${Math.round(a || 0)}deg)"><svg viewBox="-13 -8 26 16"><rect x="-11" y="-6.5" width="22" height="13" rx="4.5"/><rect x="2.5" y="-5" width="5" height="10" rx="1.6" class="gl"/></svg></div>`;
function mountMap() {
  const slot = document.querySelector('.mapslot'); if (!slot) return;
  if (!window.L) { slot.classList.add('nomap'); slot.textContent = 'Map unavailable offline'; return; }
  if (!MAP.map) {
    MAP.el = document.createElement('div'); MAP.el.className = 'lmap';
    MAP.map = L.map(MAP.el, { zoomControl: false, attributionControl: true, center: [CITY.lat, CITY.lng], zoom: 13 });
    MAP.map.attributionControl.setPrefix(false);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(MAP.map);
    MAP.layer = L.layerGroup().addTo(MAP.map);
  }
  slot.appendChild(MAP.el); MAP.map.invalidateSize({ animate: false });
  const o = JSON.parse(slot.dataset.map), k = JSON.stringify({ ...o, mine: o.mine ? o.mine.id || 'me' : null });
  if (k !== MAP.key) { MAP.key = k; drawMap(o); } else if (o.mine) moveCar(o.mine.id || 'me', o.mine);
}
function drawMap(o) {
  const m = MAP.map, css = getComputedStyle(document.documentElement), accent = css.getPropertyValue('--accent').trim() || '#e8c07a', ink = css.getPropertyValue('--ink').trim() || '#fff';
  MAP.layer.clearLayers(); MAP.cars = {};
  ['dragging', 'touchZoom', 'doubleClickZoom', 'scrollWheelZoom'].forEach(h => m[h][o.still ? 'disable' : 'enable']());
  const A = o.from && PLACES[o.from], B = o.to && PLACES[o.to], pts = [];
  const label = (p, text) => L.marker([p.lat, p.lng], { opacity: 0, interactive: false }).bindTooltip(esc(text), { permanent: true, direction: 'top', className: 'mlabel', offset: [0, -6] }).addTo(MAP.layer);
  if (o.approach && A) { const p = path(o.approach, A); L.polyline(p.map(x => [x.lat, x.lng]), { color: accent, weight: 4, dashArray: '2 8', lineCap: 'round', opacity: .9 }).addTo(MAP.layer); pts.push(...p); }
  if (A && B) { const p = path(A, B); L.polyline(p.map(x => [x.lat, x.lng]), { color: ink, weight: 5, opacity: .95 }).addTo(MAP.layer); pts.push(...p); }
  if (A) { L.circleMarker([A.lat, A.lng], { radius: 7, color: accent, weight: 4, fillColor: '#111', fillOpacity: 1 }).addTo(MAP.layer); label(A, A.name); pts.push(A); }
  if (B) { L.marker([B.lat, B.lng], { icon: L.divIcon({ className: 'mend', iconSize: [14, 14] }), interactive: false }).addTo(MAP.layer); label(B, B.name); pts.push(B); }
  (o.cars || []).forEach(c => L.marker([c.lat, c.lng], { icon: L.divIcon({ className: 'mcarwrap', html: carHTML(c.a), iconSize: [26, 26] }), interactive: false }).addTo(MAP.layer));
  if (o.mine) { MAP.cars[o.mine.id || 'me'] = L.marker([o.mine.lat, o.mine.lng], { icon: L.divIcon({ className: 'mcarwrap', html: carHTML(o.mine.a, true), iconSize: [30, 30] }), interactive: false, zIndexOffset: 500 }).addTo(MAP.layer); pts.push(o.mine); }
  if (pts.length > 1) m.fitBounds(L.latLngBounds(pts.map(x => [x.lat, x.lng])), { padding: [36, 36], maxZoom: 15, animate: false });
  else m.setView(pts[0] ? [pts[0].lat, pts[0].lng] : [CITY.lat, CITY.lng], o.zoom || 14, { animate: false });
}
function moveCar(id, p) { const mk = MAP.cars[id]; if (!mk) return; mk.setLatLng([p.lat, p.lng]); const el = mk.getElement && mk.getElement(); const c = el && el.querySelector('.mcar'); if (c) c.style.transform = `rotate(${Math.round(p.a || 0)}deg)`; }

/* ---------- live updates: Supabase Realtime pings tell the phone a trip changed, then it fetches it ---------- */
const Live = { ws: null, topics: [], ref: 0, open: false, last: 0, heard: 0, onPing: null, hb: null,
  start(topics, onPing) { const k = topics.join(','); if (k === this.topics.join(',') && this.ws) return; this.topics = topics; this.onPing = onPing; this.connect(); },
  connect() {
    try { if (this.ws) { this.ws.onclose = null; this.ws.close(); } } catch (e) {}
    this.open = false; clearInterval(this.hb);
    if (typeof WebSocket === 'undefined' || !this.topics.length) return;
    let ws; try { ws = new WebSocket(SB_URL.replace('https://', 'wss://') + '/realtime/v1/websocket?apikey=' + SB_KEY + '&vsn=1.0.0'); } catch (e) { return; }
    this.ws = ws;
    const send = m => { try { ws.send(JSON.stringify({ ...m, ref: String(++this.ref) })); } catch (e) {} };
    ws.onopen = () => { for (const t of this.topics) send({ topic: 'realtime:' + t, event: 'phx_join', payload: { config: { broadcast: { self: false }, presence: { key: '' }, private: false } } }); this.hb = setInterval(() => send({ topic: 'phoenix', event: 'heartbeat', payload: {} }), 25000); };
    ws.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === 'phx_reply' && m.payload && m.payload.status === 'ok' && m.topic !== 'phoenix') this.open = true; if (m.event === 'broadcast') { this.heard = Date.now(); if (this.onPing) this.onPing(m.payload); } } catch (err) {} };
    ws.onclose = () => { if (this.ws !== ws) return; this.open = false; clearInterval(this.hb); if (this.topics.length) setTimeout(() => { if (this.ws === ws) this.connect(); }, 4000); };
  },
  stop() { this.topics = []; try { if (this.ws) this.ws.close(); } catch (e) {} this.open = false; }
};
/* with live updates on, only check the server every 15 s as a safety net; otherwise every 2.5 s */
/* live updates only count as working once one has actually arrived in the last 10 minutes */
const pollDue = () => !Live.open || !Live.heard || Date.now() - Live.heard > 600000 || Date.now() - Live.last > 15000;

/* ---------- error log: crashes are saved to the client_errors table in Supabase ---------- */
let errCount = 0;
function logError(message, detail) {
  if (errCount++ > 10 || typeof fetch !== 'function') return;
  rpc('safar_log_error', { p_app: Account.app || 'rides', p_message: String(message || 'Unknown error'), p_detail: detail ? String(detail) : null, p_url: location.pathname, p_agent: navigator.userAgent }).catch(() => {});
}
window.addEventListener('error', e => logError(e.message, (e.error && e.error.stack) || `${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', e => { const r = e.reason || {}; if (r.kind === 'rule' || r.kind === 'session' || r.kind === 'network') return; logError(r.message || r, r.stack); });

/* ---------- account: log in and sign up (shared by both apps) ---------- */
const Account = {
  key: '', app: '', me: null, token: null,
  init(app) { this.app = app; this.key = 'safar-' + app + '-session'; this.token = LS.get(this.key, null); this.me = LS.get(this.key + '-me', null); },
  set(res) { this.token = res.token; this.me = res.account; LS.set(this.key, this.token); LS.set(this.key + '-me', this.me); },
  setMe(me) { this.me = me; LS.set(this.key + '-me', me); },
  clear() { this.token = null; this.me = null; LS.set(this.key, null); LS.set(this.key + '-me', null); },
  async refresh() {
    if (!this.token) return;
    try { this.setMe(await rpc('safar_me', { p_token: this.token, p_app: this.app })); }
    catch (e) { if (e.kind === 'session') { this.clear(); render(true); } }
  }
};
const authUI = { step: 'start', ident: '', kind: 'phone', draft: { name: '', email: '', phone: '', password: '', terms: false }, err: '', busy: false, show: false };
/* progress ring: frac 0..1 */
const ring = (frac, size, o = {}) => `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" stroke="var(--line)" stroke-width="${o.w || 8}"/><circle ${o.attr || ''} cx="50" cy="50" r="44" pathLength="100" stroke="${o.color || 'var(--accent)'}" stroke-width="${o.w || 8}" stroke-dasharray="${(Math.max(0, Math.min(1, frac)) * 100).toFixed(1)} 100"/></svg><div class="in">${o.inner || ''}</div></div>`;
function authView(o) {
  const s = authUI, d = s.draft;
  const err = s.err ? `<p class="err" role="alert">${esc(s.err)}</p>` : '';
  const busy = s.busy ? 'disabled' : '';
  const pass = (auto) => `<label class="field"><span>Password</span><span class="tel pw"><input id="au-password" data-auth="password" type="${s.show ? 'text' : 'password'}" autocomplete="${auto}" value="${esc(d.password)}" placeholder="${auto === 'new-password' ? 'At least 8 characters' : 'Your password'}"><button type="button" class="linkbtn" data-act="togglePw">${s.show ? 'Hide' : 'Show'}</button></span></label>`;
  const who = `<div class="idchip"><span>${esc(s.kind === 'phone' && normPhone(s.ident) ? showPhone(normPhone(s.ident)) : s.ident)}</span><button class="linkbtn" data-act="authStep" data-step="start">Change</button></div>`;
  let body;
  if (s.step === 'password') {
    body = `<div class="authbody"><h1 class="authh">Welcome back</h1>${who}${pass('current-password')}${err}
      <button class="btn block authgo" data-act="login" ${busy}>${s.busy ? 'Logging in…' : 'Log in'}</button>
      <p class="small muted">Forgotten your password? Password reset by email is coming soon.</p></div>`;
  } else if (s.step === 'signup') {
    const phoneField = `<label class="field"><span>Mobile number</span><span class="tel"><span>+44</span><input id="au-phone" data-auth="phone" type="tel" inputmode="tel" autocomplete="tel-national" value="${esc(d.phone)}" placeholder="07700 900123"></span></label>`;
    const emailField = `<label class="field"><span>Email</span><input id="au-email" data-auth="email" type="email" autocomplete="email" value="${esc(d.email)}" placeholder="you@example.com"></label>`;
    body = `<div class="authbody">${o.steps ? '<span class="label">Step 1 of 2</span>' : ''}<h1 class="authh">${o.signupTitle}</h1><p class="muted">${o.signupNote}</p>
      <label class="field"><span>Full name</span><input id="au-name" data-auth="name" autocomplete="name" value="${esc(d.name)}" placeholder="${o.namePh}"></label>
      ${s.kind === 'email' ? emailField + phoneField : phoneField + emailField}${pass('new-password')}
      <div class="checks"><label><input type="checkbox" id="au-terms" data-auth="terms" ${d.terms ? 'checked' : ''}>${o.termsText}</label></div>
      ${err}
      <button class="btn block authgo" data-act="signup" ${busy}>${s.busy ? 'Creating your account…' : 'Create account'}</button>
      <p class="small center">Already have an account? <button class="linkbtn" data-act="authStep" data-step="start">Log in</button></p></div>`;
  } else {
    body = `${mapSlot({ still: true, zoom: 13 }, 'hero')}<div class="authbody"><span class="brandmini">${o.logo}${esc(APP_NAME)}</span><h1 class="authh big">${o.headline}</h1>
      <label class="field"><span class="sr">Email or mobile number</span><input id="au-ident" class="identbox" data-ident type="text" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(s.ident)}" placeholder="Enter email or mobile number"></label>
      ${err}
      <button class="btn block authgo" data-act="authContinue" ${busy}>${s.busy ? 'Checking…' : 'Continue'}</button>
      <p class="small muted authfine">${o.fine}</p></div>`;
  }

}
const AuthActions = {
  authStep: d => { authUI.step = d.step; authUI.err = ''; render(true); window.scrollTo(0, 0); },
  togglePw: () => { authUI.show = !authUI.show; render(true); },
  authContinue: async () => {
    const raw = (authUI.ident || '').trim(), isEmail = raw.includes('@'), ph = normPhone(raw);
    authUI.err = !raw ? 'Enter your email or mobile number.' : isEmail ? (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(raw) ? 'That email address doesn\'t look right. Check it and try again.' : '') : (!ph ? 'Enter a UK mobile number, for example 07700 900123, or an email.' : '');
    if (authUI.err) { render(true); return; }
    authUI.kind = isEmail ? 'email' : 'phone'; authUI.busy = true; render(true);
    try {
      const r = await rpc('safar_lookup', { p_app: Account.app, p_ident: isEmail ? raw.toLowerCase() : ph });
      authUI.draft.password = '';
      if (r && r.exists) authUI.step = 'password';
      else { authUI.step = 'signup'; if (isEmail) authUI.draft.email = raw.toLowerCase(); else authUI.draft.phone = raw; }
    } catch (e) { authUI.err = e.message; }
    authUI.busy = false; render(true); window.scrollTo(0, 0);
    setTimeout(() => { const f = document.getElementById(authUI.step === 'password' ? 'au-password' : 'au-name'); if (f) f.focus(); }, 50);
  },
  login: async () => {
    const d = authUI.draft, raw = authUI.ident.trim(), ident = authUI.kind === 'email' ? raw.toLowerCase() : normPhone(raw);
    if (!d.password) { authUI.err = 'Enter your password.'; render(true); return; }
    authUI.busy = true; authUI.err = ''; render(true);
    try {
      const r = await rpc('safar_login', { p_app: Account.app, p_phone: ident, p_password: d.password });
      if (r && r.error) authUI.err = r.error; else { Account.set(r); authDone(false); }
    } catch (e) { authUI.err = e.message; }
    authUI.busy = false; render(true);
  },
  signup: async () => {
    const d = authUI.draft, ph = normPhone(d.phone);
    authUI.err = d.name.trim().length < 2 ? 'Enter your full name.' : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim()) ? 'Enter a valid email address, for example you@example.com.' : !ph ? 'Enter a UK mobile number, for example 07700 900123.' : d.password.length < 8 ? 'Use a password of at least 8 characters.' : !d.terms ? 'Tick the box to agree to the terms and privacy policy.' : '';
    if (authUI.err) { render(true); return; }
    authUI.busy = true; render(true);
    try { Account.set(await rpc('safar_signup', { p_app: Account.app, p_name: d.name.trim(), p_email: d.email.trim(), p_phone: ph, p_password: d.password })); authDone(true); }
    catch (e) { authUI.err = e.message; }
    authUI.busy = false; render(true);
  },
  logout: async () => {
    const t = Account.token; Account.clear(); Live.stop(); authUI.step = 'start'; authUI.draft.password = ''; render(true); window.scrollTo(0, 0);
    if (t) rpc('safar_logout', { p_token: t }).catch(() => {});
  }
};
function authDone(isNew) {
  authUI.err = ''; authUI.step = 'start'; authUI.ident = ''; authUI.draft = { name: '', email: '', phone: '', password: '', terms: false }; authUI.show = false;
  toast(APP_NAME, isNew ? `Welcome to ${APP_NAME}, ${first(Account.me.name)}.` : `Welcome back, ${first(Account.me.name)}.`);
  onLoggedIn();
}

/* ---------- shared wiring ---------- */
let pendingRender = false;
function render(force) {
  const a = document.activeElement;
  if (!force && a && a.closest && a.closest('#app') && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) { pendingRender = true; return; }
  pendingRender = false;
  document.documentElement.classList.toggle('authscreen', !Account.token);
  document.getElementById('app').innerHTML = view();
  lastKey = viewKey();
  mountMap();
}
let lastKey = '';
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(); }, 0));
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  e.preventDefault(); const fn = AuthActions[el.dataset.act] || ACTIONS[el.dataset.act]; if (fn) fn(el.dataset);
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset && 'ident' in t.dataset) authUI.ident = t.value; if (t.dataset && t.dataset.auth) authUI.draft[t.dataset.auth] = t.type === 'checkbox' ? t.checked : t.value; });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.auth === 'terms') authUI.draft.terms = t.checked; });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.id) return;
  const map = { 'au-ident': 'authContinue', 'au-phone': 'signup', 'au-password': authUI.step === 'password' ? 'login' : 'signup', pin: 'start' };
  const act = map[e.target.id]; if (act) { const b = document.querySelector(`[data-act="${act}"]`); if (b) b.click(); }
});
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ===== Safar X: the driver app ===== */
const APP_NAME = 'Safar X';
Account.init('driver');
const prefs = Object.assign({ online: true, pos: { ...CITY } }, LS.get('safar-driver-prefs', {}));
if (!prefs.pos || prefs.pos.lat == null) prefs.pos = { ...CITY };
const savePrefs = () => LS.set('safar-driver-prefs', prefs);
const ui = { rateTrip: null, del: false, delErr: '', tab: 'drive', declined: new Set(), editCar: false, formErr: '', formDraft: null, pinErr: '', busy: '', loaded: false };
let feed = { requests: [], trips: [] };
const writing = new Set();

const vehicle = () => Account.me && Account.me.vehicle;
const myJob = () => feed.trips.find(t => t.status === 'accepted' || t.status === 'ontrip');
function openRequests() {
  const v = vehicle(), now = Date.now();
  if (!v || !prefs.online || myJob()) return [];
  return feed.requests.filter(t => t.status === 'searching' && v.types.includes(t.type) && now - t.requestAt < REQ_WINDOW + 5000 && !ui.declined.has(t.id));
}

/* ---------- server sync ---------- */
async function poll() {
  if (!Account.token || document.hidden || !vehicle()) return;
  Live.last = Date.now();
  try {
    const next = await rpc('safar_driver_feed', { p_token: Account.token, p_online: !!prefs.online });
    const oldTrips = Object.fromEntries(feed.trips.map(t => [t.id, t])), oldReq = new Set(feed.requests.map(t => t.id));
    next.trips = next.trips.map(t => writing.has(t.id) && oldTrips[t.id] ? oldTrips[t.id] : t);
    feed = next; ui.loaded = true;
    notifyChanges(oldTrips, oldReq); render();
    if (Account.me && Account.me.id) Live.start(['safar-u-' + Account.me.id, ...(prefs.online ? ['safar-drivers'] : [])], () => poll());
  } catch (e) { if (e.kind === 'session') { Account.clear(); toast(APP_NAME, e.message); render(true); } }
}
async function patchTrip(id, patch) {
  const t = feed.trips.find(x => x.id === id); if (!t) return;
  writing.add(id); Object.assign(t, patch); render();
  try { await rpc('safar_update_trip', { p_token: Account.token, p_app: 'driver', p_id: id, p_patch: patch }); }
  catch (e) { toast(APP_NAME, e.message); }
  writing.delete(id); poll();
}
function notifyChanges(oldTrips, oldReq) {
  const v = vehicle();
  for (const t of openRequests()) if (!oldReq.has(t.id)) toast(APP_NAME, `New ${TYPES[t.type].name} request from ${PLACES[t.from].name}.`);
  for (const t of feed.trips) {
    const o = oldTrips[t.id]; if (!o) continue;
    if (o.status !== 'cancelled' && t.status === 'cancelled') toast(APP_NAME, 'The rider cancelled this trip.');
    if (!o.tip && t.tip) toast(APP_NAME, `You got a ${money(t.tip)} tip from ${t.riderName || 'your rider'}.`);
    if (!o.rating && t.rating) toast(APP_NAME, `${t.riderName || 'A rider'} gave you ${t.rating} star${t.rating > 1 ? 's' : ''}.`);
  }
}

  earn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',

const net = t => t.status === 'cancelled' ? (t.cancelFee || 0) * (1 - FEE) : tripTotal(t) * (1 - FEE) + (t.tip || 0);
const dstop = (cls, small, big, side = '') => `<div class="rstop ${cls}"><i></i><span>${small ? `<small>${small}</small>` : ''}<b>${big}</b></span>${side}</div>`;
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
function completed() { return feed.trips.filter(t => t.status === 'completed' || (t.status === 'cancelled' && t.cancelFee > 0)).sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)); }
function view() {
  if (!Account.token) return authView({ app: 'driver', logo: LOGO_X, headline: 'Sign in to drive', steps: true, signupTitle: 'Create your driver account', signupNote: 'Next you add your car. Riders see your first name and number plate.', namePh: 'Bilal Ahmed', termsText: 'I agree to the Safar X terms and privacy policy, and confirm I am 21 or over',

  return `<nav class="tabbar" style="--n:3" aria-label="Main">${tabs.map(([k, l, ic]) => `<button data-act="tab" data-tab="${k}" aria-current="${ui.tab === k}">${ic}<span>${l}</span></button>`).join('')}</nav>`;

function driveView() {
  const v = vehicle(), job = myJob(), reqs = openRequests();
  if (!ui.loaded) return '<div class="empty">Connecting to Safar…</div>';
  if (job) return jobView(job);

function earningsView() {

  if (ph === 'arrived') return map + `<section class="panel"><h2 class="status">You're at ${esc(A.name)}</h2>${rider}
      <label class="field"><span>Ask the rider for their 4-digit PIN</span><input id="pin" class="pininput" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••"></label>
      ${ui.pinErr ? `<p class="err" role="alert">${esc(ui.pinErr)}</p>` : '<p class="small muted">The trip only starts when the PIN matches.</p>'}
      <p class="small muted">Waiting is free for ${RULES.waitFreeMin} minutes, then the rider pays ${Math.round(RULES.waitPerMin * 100)}p a minute (up to ${money(RULES.waitMax)}).</p>
      <button class="btn block authgo" data-act="start" data-id="${job.id}" ${ui.busy ? 'disabled' : ''}>${ui.busy ? 'Checking…' : 'Start trip'}</button></section>`;
  if (ph === 'ontrip') return map + `<section class="panel"><div class="spread"><h2 class="status" data-eta="${job.id}">${etaText(job)}</h2><span class="pill">On trip</span></div>
      <div class="prog"><i data-prog="${job.id}" style="width:${(progress(job) * 100).toFixed(1)}%"></i></div>
      <p>Drop off at <b>${esc(B.name)}</b> · ${job.pay === 'cash' ? `collect <b>${money(job.fare)}</b> in cash` : 'paid by card'}</p>${rider}
      <button class="btn line sm" data-act="skipTrip" data-id="${job.id}">Testing: arrive now</button><a class="textbtn danger" href="tel:999">Emergency: call 999</a></section>`;
  return map + `<section class="panel"><h2 class="status">You've arrived at ${esc(B.name)}</h2>${rider}
      ${job.pay === 'cash' ? `<div class="note">${DI.cash}<span>Collect <b>${money(job.fare)}</b> in cash before the rider leaves.</span></div>` : ''}
      <button class="btn block authgo" data-act="complete" data-id="${job.id}">Complete trip</button></section>`;
}
function rateView() {
  const t = feed.trips.find(x => x.id === ui.rateTrip); if (!t) { ui.rateTrip = null; return driveView(); }
  return `<section class="panel"><span class="label">Trip complete · ${money(net(t))}</span><h2 class="status">How was ${esc(t.riderName || 'your rider')}?</h2>
    <p class="small muted">Riders don't see who rated them. Low ratings help us keep drivers safe.</p>
    <div class="stars" role="group" aria-label="Rate your rider">${[1, 2, 3, 4, 5].map(n => `<button data-act="rateRider" data-n="${n}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}</div>
    <button class="textbtn" data-act="rateRider" data-n="0">Skip</button></section>`;
}
function deleteBox() {
  if (!ui.del) return '<button class="textbtn danger" data-act="delAsk">Delete my account</button>';
  return `<div class="ticket"><b>Delete your account?</b><p class="small muted">Your name, email, phone number and car are removed and you're logged out. Past trips stay in our records without your details. This can't be undone.</p>
    <label class="field"><span>Enter your password to confirm</span><input id="del-pw" type="password" autocomplete="current-password"></label>
    ${ui.delErr ? `<p class="err" role="alert">${esc(ui.delErr)}</p>` : ''}
    <button class="btn danger" data-act="delConfirm" ${ui.busy ? 'disabled' : ''}>${ui.busy ? 'Deleting…' : 'Delete my account'}</button><button class="textbtn" data-act="delAsk">Keep my account</button></div>`;
}
function carForm() {
  const p = vehicle(), v = ui.formDraft || p || { car: '', colour: '', plate: '', types: ['go'] };
  return `<section class="sheet">
    <div class="stack tight"><span class="label">${p ? 'Your car' : 'Step 2 of 2'}</span><h1>${p ? 'Edit car details' : 'Add your car, ' + esc(first(Account.me.name))}</h1>
    <p class="small muted">Riders see your first name, car and number plate when you accept their ride.</p></div>
    <div class="grid2">
      <label class="field"><span>Number plate</span><input id="su-plate" class="mono" value="${esc(v.plate)}" placeholder="YK21 BLL" style="text-transform:uppercase"></label>
      <label class="field"><span>Car make and model</span><input id="su-car" value="${esc(v.car)}" placeholder="Toyota Corolla Hybrid"></label>
      <label class="field"><span>Colour</span><input id="su-colour" value="${esc(v.colour)}" placeholder="Silver"></label>
    </div>
    <div class="stack tight"><span class="label">Ride types you can take</span>
      <div class="checks">${Object.entries(TYPES).map(([k, t]) => `<label><input type="checkbox" id="su-t-${k}" ${v.types.includes(k) ? 'checked' : ''}>${t.name} <span class="small muted">· ${t.blurb.toLowerCase()}</span></label>`).join('')}</div></div>
    ${p ? '' : `<div class="stack tight"><span class="label">Before you drive</span><div class="checks">
      ${['I hold a private hire driver licence', 'My car has hire and reward insurance', 'My car has a valid MOT'].map((l, i) => `<label><input type="checkbox" id="su-d${i + 1}" ${v.docs && v.docs[i] ? 'checked' : ''}>${l}</label>`).join('')}</div></div>`}
    ${ui.formErr ? `<p class="err" role="alert">${esc(ui.formErr)}</p>` : ''}
    <div class="row"><button class="btn" data-act="saveCar" style="flex:1" ${ui.busy ? 'disabled' : ''}>${ui.busy ? 'Saving…' : p ? 'Save details' : 'Start driving'}</button>${p ? '<button class="btn ghost" data-act="cancelCar">Cancel</button>' : ''}</div>
  </section>`;
}
function viewKey() { const j = Account.token && vehicle() && myJob(); return (Account.token ? 'in' : 'out') + (vehicle() ? 'v' : '') + (j ? j.id + phase(j) : 'req:' + openRequests().map(t => t.id).join(',')); }

/* ---------- actions ---------- */
const ACTIONS = {
  rateRider: d => { const id = ui.rateTrip; ui.rateTrip = null; if (+d.n) { patchTrip(id, { riderRating: +d.n }); toast(APP_NAME, 'Thanks for rating your rider.'); } else render(true); },
  delAsk: () => { ui.del = !ui.del; ui.delErr = ''; render(true); },
  delConfirm: async () => {
    const pw = (document.getElementById('del-pw') || {}).value || '';
    if (!pw) { ui.delErr = 'Enter your password.'; render(true); return; }
    ui.busy = 'del'; ui.delErr = ''; render(true);
    try { await rpc('safar_delete_account', { p_token: Account.token, p_app: 'driver', p_password: pw }); Account.clear(); Live.stop(); ui.del = false; toast(APP_NAME, 'Your account has been deleted.'); }
    catch (e) { ui.delErr = e.kind === 'setup' ? 'Account deletion is still being set up.' : e.message; }
    ui.busy = ''; render(true);
  },
  tab: d => { ui.tab = d.tab; render(true); window.scrollTo(0, 0); },
  online: () => { prefs.online = !prefs.online; savePrefs(); render(true); Live.stop(); poll(); },
  editCar: () => { ui.editCar = true; ui.formErr = ''; ui.formDraft = null; render(true); },
  cancelCar: () => { ui.editCar = false; ui.formErr = ''; ui.formDraft = null; render(true); },
  saveCar: async () => {
    const g = id => (document.getElementById(id) || {}).value || '';
    const p = { plate: g('su-plate').trim().toUpperCase(), car: g('su-car').trim(), colour: g('su-colour').trim(), types: Object.keys(TYPES).filter(k => document.getElementById('su-t-' + k).checked) };
    const docs = ['su-d1', 'su-d2', 'su-d3'].map(id => !!(document.getElementById(id) || {}).checked);
    ui.formErr = !p.car || !p.colour ? 'Fill in your car and its colour.' : !/^[A-Z0-9 ]{2,8}$/.test(p.plate) ? 'Enter a number plate, for example YK21 BLL.' : !p.types.length ? 'Choose at least one ride type.' : !vehicle() && !docs.every(Boolean) ? 'Tick all three boxes to confirm your licence, insurance and MOT.' : '';
    ui.formDraft = Object.assign({}, p, { docs });
    if (ui.formErr) { render(true); return; }
    const first_ = !vehicle(); ui.busy = 'car'; render(true);
    try { Account.setMe(await rpc('safar_set_vehicle', { p_token: Account.token, p_vehicle: p })); ui.editCar = false; ui.formDraft = null; if (first_) toast(APP_NAME, 'You are set up. Go online to get ride requests.'); poll(); }
    catch (e) { ui.formErr = e.message; }
    ui.busy = ''; render(true);
  },
  decline: d => { ui.declined.add(d.id); render(true); },
  accept: async d => {
    const t = feed.requests.find(x => x.id === d.id); if (!t || ui.busy) return;
    const A = PLACES[t.from]; ui.busy = t.id; render(true);
    try {
      await rpc('safar_accept_trip', { p_token: Account.token, p_id: t.id, p_patch: { start: { lat: prefs.pos.lat, lng: prefs.pos.lng }, acceptedAt: Date.now(), pickupDur: Math.max(6000, roadMiles(prefs.pos, A) * 2600), pickupMins: minsBetween(prefs.pos, A) } });
      toast(APP_NAME, `Ride accepted. Head to ${A.name}.`);
    } catch (e) { toast(APP_NAME, e.message); ui.declined.add(t.id); }
    ui.busy = ''; await poll(); render(true);
  },
  skipPickup: d => { const t = feed.trips.find(x => x.id === d.id); patchTrip(d.id, { pickupDur: Math.max(0, Date.now() - t.acceptedAt) }); },
  start: async d => {
    const t = feed.trips.find(x => x.id === d.id), v = ((document.getElementById('pin') || {}).value || '').trim();
    if (!/^\d{4}$/.test(v)) { ui.pinErr = 'Enter the 4-digit PIN from the rider.'; render(true); return; }
    ui.busy = 'pin'; ui.pinErr = ''; render(true);
    try { await rpc('safar_start_trip', { p_token: Account.token, p_id: d.id, p_pin: v, p_patch: { startedAt: Date.now(), tripDur: 8000 + t.miles * 2500 } }); }
    catch (e) { ui.pinErr = e.message; }
    ui.busy = ''; await poll(); render(true);
  },
  skipTrip: d => { const t = feed.trips.find(x => x.id === d.id); patchTrip(d.id, { tripDur: Math.max(0, Date.now() - t.startedAt) }); },
  complete: d => {
    const t = feed.trips.find(x => x.id === d.id); prefs.pos = { lat: PLACES[t.to].lat, lng: PLACES[t.to].lng }; savePrefs();
    patchTrip(d.id, { status: 'completed', completedAt: Date.now() });
    toast(APP_NAME, `Trip complete. You earned ${money(tripTotal(t) * (1 - FEE))}.`); ui.rateTrip = t.id;
  }
};

/* ---------- clock ---------- */
function tick() {
  if (!Account.token) return;
  if (viewKey() !== lastKey) { render(); return; }
  const now = Date.now(), job = vehicle() && myJob();
  if (job) {
    const pt = carPos(job, now);
    moveCar(job.id, pt);
    document.querySelectorAll(`[data-prog="${job.id}"]`).forEach(b => b.style.width = (progress(job, now) * 100).toFixed(1) + '%');
    document.querySelectorAll(`[data-eta="${job.id}"]`).forEach(x => x.textContent = etaText(job));
  }
  document.querySelectorAll('[data-count]').forEach(x => { const t = feed.requests.find(r => r.id === x.dataset.count); if (t) x.textContent = Math.max(0, Math.ceil((t.requestAt + REQ_WINDOW - now) / 1000)); });
  document.querySelectorAll('[data-ring]').forEach(x => { const t = feed.requests.find(r => r.id === x.dataset.ring); if (t) x.setAttribute('stroke-dasharray', (Math.max(0, (t.requestAt + REQ_WINDOW - now) / REQ_WINDOW) * 100).toFixed(1) + ' 100'); });
}
/* swipe to accept: drag the coral knob to the end of the track */
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.swipe && +t.value >= 90 && !ui.busy) { t.value = 100; t.blur(); ACTIONS.accept({ id: t.dataset.swipe }); } });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.swipe && +t.value < 90) { t.value = 0; t.blur(); } });
function onLoggedIn() { ui.tab = 'drive'; ui.loaded = false; feed = { requests: [], trips: [] }; poll(); }
setInterval(tick, 250);
setInterval(() => { if (pollDue()) poll(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
render(true);
if (Account.token) Account.refresh().then(() => { render(true); poll(); });
</script></body></html>
